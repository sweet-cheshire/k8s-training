apiVersion: v1
kind: Pod
metadata:
  name: ready-demo
  labels:
    app: ready-demo
spec:
  containers:
  - name: app
    image: busybox
    args: ["sh", "-c", "rm -f /tmp/ready; sleep 20; touch /tmp/ready; sleep 600"]
    readinessProbe:
      exec:
        command: ["sh", "-c", "test -f /tmp/ready"]
      periodSeconds: 2
---
apiVersion: v1
kind: Service
metadata:
  name: ready-demo-svc
spec:
  selector:
    app: ready-demo
  ports:
  - port: 80
    targetPort: 8080
