apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: nginx
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/<твой-логин>/<репо>.git
    targetRevision: main
    path: home/nginx
  destination:
    server: https://kubernetes.default.svc
    namespace: nginx
  syncOptions:
  - CreateNamespace=true
